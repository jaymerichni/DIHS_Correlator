[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "DIHS_Correlator"
version = "1.0.0"
description = "DIHS-based software for interpretable tephra-source correlation."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
keywords = [
    "tephra correlation",
    "tephrochronology",
    "machine learning",
    "geochemistry",
    "DIHS",
]
dependencies = [
    "flask",
    "matplotlib",
    "numpy",
    "pandas",
    "scikit-bio",
    "scikit-learn",
]

[project.optional-dependencies]
reproducibility = [
    "ipykernel",
    "jupyterlab",
    "nbconvert",
    "openpyxl",
]
test = [
    "build",
    "pytest",
    "twine",
]

[project.urls]
Homepage = "https://github.com/jaymerichni/DIHS_Correlator"
Repository = "https://github.com/jaymerichni/DIHS_Correlator"
Issues = "https://github.com/jaymerichni/DIHS_Correlator/issues"

[project.scripts]
dihs-tephra-correlator = "DIHS_Correlator.web:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
"DIHS_Correlator.web" = ["templates/*.html", "static/*.css", "static/*.js", "static/branding/*.png"]

[tool.setuptools.packages.find]
where = ["src"]
